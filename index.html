.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);background:#0f1b2d;color:#fff;padding:12px 18px;border-radius:12px;font-size:14.5px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.3);transition:transform .3s;z-index:50}

    if (reducido) { el.textContent = meta; return; }
    const t0 = performance.now(), dur = 1200;
    (function paso(t) { const k = Math.min(1, (t - t0) / dur); el.textContent = Math.round(meta * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(paso); })(t0);
  }

  /* ---- Animaciones al hacer scroll (IntersectionObserver) ---- */
  function activar(sec) {
    sec.classList.add("ver");
    $$(".n[data-meta]", sec).forEach(contar);
    $$(".anillo", sec).forEach(a => a.style.setProperty("--p", a.dataset.p));
    $$(".anim-chips:not([hidden])", sec).forEach(c => c.classList.add("ver"));
  }
  if ("IntersectionObserver" in window && !reducido) {
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { activar(e.target); io.unobserve(e.target); } }), { threshold: 0.15 });
    $$(".revelar").forEach(s => io.observe(s));
  } else { $$(".revelar").forEach(activar); }

  /* ---- Scroll-spy: resalta la pestaña de la sección visible ---- */
  const links = $$(".nav a");
  if ("IntersectionObserver" in window) {
    const spy = new IntersectionObserver(es => es.forEach(e => {
      if (!e.isIntersecting) return;
      links.forEach(a => {
        const on = a.getAttribute("href") === "#" + e.target.id;
        a.classList.toggle("activo", on);
        if (on) { a.setAttribute("aria-current", "true"); const ul = a.closest("ul"); ul.scrollTo({ left: a.parentElement.offsetLeft - 16, behavior: reducido ? "auto" : "smooth" }); }
        else a.removeAttribute("aria-current");
      });
    }), { rootMargin: "-45% 0px -50% 0px" });
    $$("main section").forEach(s => spy.observe(s));
  }
})();
</script>
</body>
</html>
